}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘DM Sans’, sans-serif;
background: var(–cream);
color: var(–ink);
min-height: 100vh;
padding-bottom: 56px;
padding-top: env(safe-area-inset-top);
}

/* ── TAB BAR ── */
.tab-bar {
display: flex;
border-bottom: 1px solid var(–border);
background: var(–cream);
position: sticky;
top: 0;
z-index: 10;
padding-top: env(safe-area-inset-top);
}

.tab {
flex: 1;
padding: 14px 4px 12px;
text-align: center;
cursor: pointer;
border-bottom: 2px solid transparent;
transition: all 0.2s;
position: relative;
top: 1px;
}

.tab .tab-futures {
font-size: 13px;
font-weight: 500;
color: var(–ink-muted);
letter-spacing: 0.02em;
transition: color 0.2s;
}

.tab .tab-cash {
font-size: 9px;
font-weight: 400;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–ink-muted);
opacity: 0.6;
margin-top: 1px;
transition: color 0.2s;
}

.tab.active-0 { border-bottom-color: var(–c0); }
.tab.active-0 .tab-futures { color: var(–c0); }
.tab.active-0 .tab-cash { color: var(–c0); opacity: 0.7; }

.tab.active-1 { border-bottom-color: var(–c1); }
.tab.active-1 .tab-futures { color: var(–c1); }
.tab.active-1 .tab-cash { color: var(–c1); opacity: 0.7; }

.tab.active-2 { border-bottom-color: var(–c2); }
.tab.active-2 .tab-futures { color: var(–c2); }
.tab.active-2 .tab-cash { color: var(–c2); opacity: 0.7; }

/* ── PANEL ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── SETUP ── */
.setup-wrap {
padding: 40px 28px 40px;
min-height: calc(100vh - 56px);
display: flex;
flex-direction: column;
}

.setup-eyebrow {
font-size: 10px;
font-weight: 500;
letter-spacing: 0.2em;
text-transform: uppercase;
margin-bottom: 8px;
}

.setup-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: 30px;
font-weight: 300;
line-height: 1.2;
color: var(–ink);
margin-bottom: 6px;
}

.setup-title em { font-style: italic; }

.setup-desc {
font-size: 13px;
color: var(–ink-muted);
line-height: 1.6;
margin-bottom: 32px;
font-weight: 300;
}

.setup-fields { flex: 1; }
.setup-field { margin-bottom: 18px; }

.setup-field label {
display: block;
font-size: 10px;
font-weight: 500;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–ink-muted);
margin-bottom: 7px;
}

.setup-field label .dot {
display: inline-block;
width: 7px; height: 7px;
border-radius: 50%;
margin-right: 6px;
vertical-align: middle;
position: relative; top: -1px;
}

.setup-input {
width: 100%;
background: white;
border: 1.5px solid var(–border);
border-radius: 14px;
padding: 16px 20px;
font-family: ‘DM Sans’, sans-serif;
font-size: 26px;
font-weight: 300;
color: var(–ink);
outline: none;
transition: border-color 0.2s;
-webkit-appearance: none;
}

.setup-input::placeholder { color: var(–ink-muted); opacity: 0.4; }

.spread-preview {
border-radius: 12px;
padding: 13px 16px;
margin-top: 16px;
display: flex;
align-items: center;
justify-content: space-between;
opacity: 0;
transition: opacity 0.3s;
border: 1px solid transparent;
}

.spread-preview.visible { opacity: 1; }

.spread-preview .sp-label {
font-size: 11px;
font-weight: 500;
letter-spacing: 0.04em;
}

.spread-preview .sp-value {
font-family: ‘Cormorant Garamond’, serif;
font-size: 24px;
font-weight: 400;
}

.setup-btn {
width: 100%;
color: white;
border: none;
border-radius: 14px;
padding: 17px;
font-family: ‘DM Sans’, sans-serif;
font-size: 15px;
font-weight: 500;
letter-spacing: 0.04em;
cursor: pointer;
margin-top: 24px;
transition: all 0.2s;
opacity: 0.35;
pointer-events: none;
}

.setup-btn.ready { opacity: 1; pointer-events: all; }
.setup-btn:active { filter: brightness(1.1); transform: scale(0.98); }

/* ── MAIN ── */
.main-wrap { display: none; }
.main-wrap.visible { display: block; }

.main-header {
padding: 28px 24px 16px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: flex-end;
justify-content: space-between;
}

.main-header .eyebrow {
font-size: 10px;
font-weight: 500;
letter-spacing: 0.18em;
text-transform: uppercase;
margin-bottom: 3px;
}

.main-header h2 {
font-family: ‘Cormorant Garamond’, serif;
font-size: 24px;
font-weight: 300;
color: var(–ink);
}

.main-header h2 em { font-style: italic; }

.recal-btn {
background: none;
border: 1px solid var(–border);
border-radius: 8px;
padding: 7px 12px;
font-family: ‘DM Sans’, sans-serif;
font-size: 11px;
font-weight: 500;
color: var(–ink-muted);
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}

.spread-pill {
display: flex;
align-items: center;
padding: 9px 24px;
border-bottom: 1px solid transparent;
}

.spread-pill .pill-label {
font-size: 11px;
font-weight: 400;
}

.spread-pill .pill-value {
font-family: ‘Cormorant Garamond’, serif;
font-size: 16px;
font-weight: 500;
margin-left: auto;
}

/* ── INPUT ── */
.input-section { padding: 24px 24px 16px; }

.input-label {
font-size: 10px;
font-weight: 500;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(–ink-muted);
margin-bottom: 9px;
display: flex;
align-items: center;
gap: 6px;
}

.input-label .dot {
width: 7px; height: 7px;
border-radius: 50%;
flex-shrink: 0;
}

.big-input-wrap { position: relative; }

.big-input {
width: 100%;
background: white;
border: 2px solid var(–border);
border-radius: 16px;
padding: 20px 78px 20px 20px;
font-family: ‘DM Sans’, sans-serif;
font-size: 34px;
font-weight: 300;
color: var(–ink);
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
-webkit-appearance: none;
}

.big-input::placeholder { color: var(–ink-muted); opacity: 0.3; }

.ticker-tag {
position: absolute;
right: 14px;
top: 50%;
transform: translateY(-50%);
color: white;
font-size: 10px;
font-weight: 600;
letter-spacing: 0.1em;
border-radius: 7px;
padding: 4px 9px;
}

/* ── ARROW ── */
.arrow-row {
display: flex;
align-items: center;
padding: 0 24px;
gap: 10px;
margin: 0;
}

.arrow-row::before, .arrow-row::after {
content: ‘’; flex: 1; height: 1px; background: var(–border);
}

.arrow-icon { color: var(–ink-muted); font-size: 16px; }

/* ── RESULT ── */
.result-section { padding: 12px 24px 20px; }

.result-label {
font-size: 10px;
font-weight: 500;
letter-spacing: 0.18em;
text-transform: uppercase;
color: var(–ink-muted);
margin-bottom: 9px;
display: flex;
align-items: center;
gap: 6px;
}

.result-label .dot {
width: 7px; height: 7px;
border-radius: 50%;
background: var(–ink-muted);
transition: background 0.3s;
flex-shrink: 0;
}

.result-label.active .dot { /* color set per pair in JS */ }

.result-box {
background: var(–cream-dark);
border-radius: 16px;
padding: 20px;
display: flex;
align-items: center;
justify-content: space-between;
transition: all 0.3s ease;
border: 2px solid transparent;
min-height: 82px;
}

.result-price {
font-family: ‘Cormorant Garamond’, serif;
font-size: 40px;
font-weight: 300;
color: var(–ink-muted);
transition: color 0.3s;
}

.copy-icon-btn {
width: 40px; height: 40px;
border-radius: 10px;
background: white;
border: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
opacity: 0;
transition: all 0.2s;
flex-shrink: 0;
}

.copy-icon-btn.visible { opacity: 1; }
.copy-icon-btn svg { width: 16px; height: 16px; }
.copy-icon-btn svg path, .copy-icon-btn svg rect { stroke-width: 2; fill: none; }

.result-sub {
font-size: 11px;
color: var(–ink-muted);
margin-top: 7px;
min-height: 15px;
}

/* ── DIVIDER ── */
.divider { height: 1px; background: var(–border); margin: 0 24px; }

/* ── REVERSE ── */
.reverse-section { padding: 18px 24px 0; }

.reverse-title {
font-size: 10px;
font-weight: 500;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(–ink-muted);
margin-bottom: 10px;
}

.reverse-row { display: flex; align-items: center; gap: 10px; }

.reverse-input {
flex: 1;
background: white;
border: 1.5px solid var(–border);
border-radius: 12px;
padding: 13px 15px;
font-family: ‘DM Sans’, sans-serif;
font-size: 20px;
font-weight: 300;
color: var(–ink);
outline: none;
transition: border-color 0.2s;
-webkit-appearance: none;
}

.reverse-input::placeholder { color: var(–ink-muted); opacity: 0.4; }

.reverse-result-box {
flex: 1;
background: var(–cream-dark);
border-radius: 12px;
padding: 12px 14px;
display: flex;
align-items: center;
justify-content: space-between;
}

.reverse-result-inner { text-align: left; }

.reverse-result-label {
font-size: 9px;
font-weight: 500;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(–ink-muted);
margin-bottom: 1px;
}

.reverse-result-val {
font-family: ‘Cormorant Garamond’, serif;
font-size: 21px;
font-weight: 400;
color: var(–ink-soft);
}

/* ── TOAST ── */
.toast {
position: fixed;
bottom: 32px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(–ink);
color: white;
font-size: 13px;
font-weight: 500;
padding: 12px 24px;
border-radius: 100px;
opacity: 0;
transition: all 0.25s ease;
pointer-events: none;
white-space: nowrap;
z-index: 999;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── UNCALIBRATED NOTICE ── */
.uncal-notice {
margin: 32px 24px;
border-radius: 14px;
padding: 20px;
text-align: center;
}

.uncal-notice p {
font-size: 13px;
line-height: 1.6;
margin-bottom: 14px;
}

.uncal-btn {
color: white;
border: none;
border-radius: 12px;
padding: 14px 24px;
font-family: ‘DM Sans’, sans-serif;
font-size: 14px;
font-weight: 500;
cursor: pointer;
transition: all 0.2s;
}

.uncal-btn:active { filter: brightness(1.1); transform: scale(0.98); }
</style>

</head>
<body>

<!-- TAB BAR -->

<div class="tab-bar" id="tabBar">
  <div class="tab active-0" id="tab0" onclick="switchTab(0)">
    <div class="tab-futures">MNQ</div>
    <div class="tab-cash">NAS100</div>
  </div>
  <div class="tab" id="tab1" onclick="switchTab(1)">
    <div class="tab-futures">MES</div>
    <div class="tab-cash">SPX500</div>
  </div>
  <div class="tab" id="tab2" onclick="switchTab(2)">
    <div class="tab-futures">MGC</div>
    <div class="tab-cash">XAUUSD</div>
  </div>
</div>

<!-- PANELS -->

<div id="panels"></div>

<div class="toast" id="toast"></div>

<script>
const PAIRS = [
  {
    id: 'mnq',
    futures: 'MNQ',
    cash: 'NAS100',
    color: '#3D8B8B',
    pale: '#E8F4F4',
    border: 'rgba(61,139,139,0.25)',
    futuresStep: '0.25',
    cashStep: '0.01',
    futuresPlaceholder: '26168.50',
    cashPlaceholder: '26197.00',
    storageKey: 'spread_mnq_nas',
  },
  {
    id: 'mes',
    futures: 'MES',
    cash: 'SPX500',
    color: '#4A6FA5',
    pale: '#EBF0F8',
    border: 'rgba(74,111,165,0.25)',
    futuresStep: '0.25',
    cashStep: '0.01',
    futuresPlaceholder: '5280.00',
    cashPlaceholder: '5282.50',
    storageKey: 'spread_mes_spx',
  },
  {
    id: 'mgc',
    futures: 'MGC',
    cash: 'XAUUSD',
    color: '#B8862A',
    pale: '#FBF4E4',
    border: 'rgba(184,134,42,0.25)',
    futuresStep: '0.10',
    cashStep: '0.01',
    futuresPlaceholder: '3340.00',
    cashPlaceholder: '3342.50',
    storageKey: 'spread_mgc_xau',
  }
];

let activeTab = 0;
let spreads = [null, null, null];

// ── BUILD PANELS ──
function buildPanels() {
  const container = document.getElementById('panels');
  PAIRS.forEach((p, i) => {
    const panel = document.createElement('div');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = `panel${i}`;
    panel.innerHTML = `
      <!-- SETUP -->
      <div class="setup-wrap" id="setup${i}">
        <div class="setup-eyebrow" style="color:${p.color}">One-time setup · ${p.futures} / ${p.cash}</div>
        <h2 class="setup-title">Calibrate your<br><em style="color:${p.color}">spread</em> once.</h2>
        <p class="setup-desc">Enter both live prices right now. Spread is saved — after this you only type one number.</p>
        <div class="setup-fields">
          <div class="setup-field">
            <label><span class="dot" style="background:${p.color}"></span>${p.futures} current price</label>
            <input class="setup-input" id="setupF${i}" type="number" inputmode="decimal"
              step="${p.futuresStep}" placeholder="${p.futuresPlaceholder}" autocomplete="off"
              style="--focus-color:${p.color}"
              onfocus="this.style.borderColor='${p.color}'" onblur="this.style.borderColor=''"
              oninput="updatePreview(${i})">
          </div>
          <div class="setup-field">
            <label><span class="dot" style="background:${p.color}"></span>${p.cash} current price</label>
            <input class="setup-input" id="setupC${i}" type="number" inputmode="decimal"
              step="${p.cashStep}" placeholder="${p.cashPlaceholder}" autocomplete="off"
              onfocus="this.style.borderColor='${p.color}'" onblur="this.style.borderColor=''"
              oninput="updatePreview(${i})">
          </div>
          <div class="spread-preview" id="preview${i}" style="background:${p.pale};border-color:${p.border}">
            <span class="sp-label" style="color:${p.color}">Spread locked in at</span>
            <span class="sp-value" style="color:${p.color}" id="previewVal${i}">—</span>
          </div>
        </div>
        <button class="setup-btn" id="setupBtn${i}" style="background:${p.color}"
          onclick="completeSetup(${i})">Save Spread &amp; Start →</button>
      </div>

      <!-- MAIN -->
      <div class="main-wrap" id="main${i}">
        <div class="main-header">
          <div>
            <div class="eyebrow" style="color:${p.color}">${p.futures} → ${p.cash}</div>
            <h2>${p.futures} → <em style="color:${p.color}">${p.cash}</em></h2>
          </div>
          <button class="recal-btn" onclick="showRecal(${i})">Recalibrate</button>
        </div>

        <div class="spread-pill" style="background:${p.pale};border-bottom-color:${p.border}">
          <span class="pill-label" style="color:${p.color}">Saved spread (${p.cash} − ${p.futures})</span>
          <span class="pill-value" style="color:${p.color}" id="pill${i}">—</span>
        </div>

        <div class="input-section">
          <div class="input-label">
            <span class="dot" style="background:${p.color}"></span>
            Your ${p.futures} target price
          </div>
          <div class="big-input-wrap">
            <input class="big-input" id="fTarget${i}" type="number" inputmode="decimal"
              step="${p.futuresStep}" placeholder="${p.futuresPlaceholder}" autocomplete="off"
              onfocus="this.style.borderColor='${p.color}';this.style.boxShadow='0 0 0 4px ${p.pale}'"
              onblur="this.style.borderColor='';this.style.boxShadow=''"
              oninput="convert(${i})">
            <span class="ticker-tag" style="background:${p.color}">${p.futures}</span>
          </div>
        </div>

        <div class="arrow-row"><span class="arrow-icon">↓</span></div>

        <div class="result-section">
          <div class="result-label" id="rLabel${i}">
            <span class="dot"></span>${p.cash} alert price
          </div>
          <div class="result-box" id="rBox${i}">
            <span class="result-price" id="rPrice${i}">—</span>
            <button class="copy-icon-btn" id="rCopy${i}" onclick="copyVal('rPrice${i}')">
              <svg viewBox="0 0 24 24" style="stroke:${p.color}">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
              </svg>
            </button>
          </div>
          <div class="result-sub" id="rSub${i}"></div>
        </div>

        <div class="divider"></div>

        <div class="reverse-section">
          <div class="reverse-title">Reverse — ${p.cash} → ${p.futures} equivalent</div>
          <div class="reverse-row">
            <input class="reverse-input" id="cTarget${i}" type="number" inputmode="decimal"
              step="${p.cashStep}" placeholder="${p.cash} price" autocomplete="off"
              onfocus="this.style.borderColor='${p.color}'" onblur="this.style.borderColor=''"
              oninput="convertReverse(${i})">
            <div class="reverse-result-box">
              <div class="reverse-result-inner">
                <div class="reverse-result-label">${p.futures} level</div>
                <div class="reverse-result-val" id="revVal${i}">—</div>
              </div>
              <button class="copy-icon-btn" id="revCopy${i}" onclick="copyVal('revVal${i}')"
                style="width:20px;height:20px;border:none;border-radius:5px;padding:0;">
                <svg viewBox="0 0 24 24" style="stroke:${p.color}">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(panel);
  });
}

// ── TABS ──
function switchTab(i) {
  activeTab = i;
  document.querySelectorAll('.panel').forEach((p, idx) => {
    p.classList.toggle('active', idx === i);
  });
  document.querySelectorAll('.tab').forEach((t, idx) => {
    t.className = 'tab' + (idx === i ? ` active-${i}` : '');
  });
}

// ── SETUP ──
function updatePreview(i) {
  const f = parseFloat(document.getElementById(`setupF${i}`).value);
  const c = parseFloat(document.getElementById(`setupC${i}`).value);
  const preview = document.getElementById(`preview${i}`);
  const val = document.getElementById(`previewVal${i}`);
  const btn = document.getElementById(`setupBtn${i}`);
  if (!isNaN(f) && !isNaN(c)) {
    const s = c - f;
    val.textContent = (s >= 0 ? '+' : '') + s.toFixed(2);
    preview.classList.add('visible');
    btn.classList.add('ready');
  } else {
    preview.classList.remove('visible');
    btn.classList.remove('ready');
  }
}

function completeSetup(i) {
  const f = parseFloat(document.getElementById(`setupF${i}`).value);
  const c = parseFloat(document.getElementById(`setupC${i}`).value);
  if (isNaN(f) || isNaN(c)) return;
  spreads[i] = c - f;
  localStorage.setItem(PAIRS[i].storageKey, spreads[i].toString());
  showMain(i);
}

function showMain(i) {
  document.getElementById(`setup${i}`).style.display = 'none';
  const m = document.getElementById(`main${i}`);
  m.classList.add('visible');
  const s = spreads[i];
  document.getElementById(`pill${i}`).textContent = (s >= 0 ? '+' : '') + s.toFixed(2);
  if (i === activeTab) setTimeout(() => document.getElementById(`fTarget${i}`).focus(), 100);
}

function showRecal(i) {
  spreads[i] = null;
  localStorage.removeItem(PAIRS[i].storageKey);
  document.getElementById(`setup${i}`).style.display = '';
  document.getElementById(`main${i}`).classList.remove('visible');
  document.getElementById(`setupF${i}`).value = '';
  document.getElementById(`setupC${i}`).value = '';
  document.getElementById(`preview${i}`).classList.remove('visible');
  document.getElementById(`setupBtn${i}`).classList.remove('ready');
  document.getElementById(`fTarget${i}`).value = '';
  document.getElementById(`cTarget${i}`).value = '';
  resetResult(i);
}

// ── CONVERT ──
function convert(i) {
  const fT = parseFloat(document.getElementById(`fTarget${i}`).value);
  const p = PAIRS[i];
  const s = spreads[i];
  if (!isNaN(fT) && s !== null) {
    const result = fT + s;
    const priceEl = document.getElementById(`rPrice${i}`);
    priceEl.textContent = result.toFixed(2);
    priceEl.style.color = p.color;
    document.getElementById(`rBox${i}`).style.cssText = `background:${p.pale};border-color:${p.border};border-width:2px;border-style:solid;border-radius:16px;padding:20px;display:flex;align-items:center;justify-content:space-between;min-height:82px;transition:all 0.3s`;
    const dot = document.querySelector(`#rLabel${i} .dot`);
    if (dot) dot.style.background = p.color;
    document.getElementById(`rSub${i}`).textContent = `${fT.toFixed(2)} + ${s >= 0 ? '+' : ''}${s.toFixed(2)} spread`;
    document.getElementById(`rCopy${i}`).classList.add('visible');
  } else {
    resetResult(i);
  }
}

function convertReverse(i) {
  const cT = parseFloat(document.getElementById(`cTarget${i}`).value);
  const el = document.getElementById(`revVal${i}`);
  const btn = document.getElementById(`revCopy${i}`);
  if (!isNaN(cT) && spreads[i] !== null) {
    el.textContent = (cT - spreads[i]).toFixed(2);
    btn.classList.add('visible');
  } else {
    el.textContent = '—';
    btn.classList.remove('visible');
  }
}

function resetResult(i) {
  const priceEl = document.getElementById(`rPrice${i}`);
  priceEl.textContent = '—';
  priceEl.style.color = '';
  document.getElementById(`rBox${i}`).style.cssText = '';
  const dot = document.querySelector(`#rLabel${i} .dot`);
  if (dot) dot.style.background = '';
  document.getElementById(`rSub${i}`).textContent = '';
  document.getElementById(`rCopy${i}`).classList.remove('visible');
}

// ── COPY ──
function copyVal(elId) {
  const text = document.getElementById(elId).textContent;
  if (text === '—') return;
  navigator.clipboard.writeText(text).catch(() => {});
  const toast = document.getElementById('toast');
  toast.textContent = text + ' copied';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

// ── INIT ──
buildPanels();

PAIRS.forEach((p, i) => {
  const saved = localStorage.getItem(p.storageKey);
  if (saved !== null) {
    spreads[i] = parseFloat(saved);
    showMain(i);
  }
});
</script>
